services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: touchnrelief_test
      POSTGRES_USER: touchnrelief
      POSTGRES_PASSWORD: local-test-only
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U touchnrelief -d touchnrelief_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
